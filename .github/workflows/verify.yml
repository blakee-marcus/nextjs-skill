name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify public surface
        run: python3 scripts/verify_public_surface.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Discover Agent Skill
        run: npx --yes skills@1.7.0 add . --list
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.289
      - name: Validate Claude plugin metadata
        run: claude plugin validate . --strict
